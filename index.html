<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d97706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>卡密管理</title>
<style>
:root {
  --bg: #fef9f3;
  --bg-2: #fdf3e7;
  --card: #ffffff;
  --text: #451a03;
  --text-2: #92847a;
  --text-3: #b8a99a;
  --border: #f5e6d8;
  --border-2: #ecd9c5;
  --primary: #d97706;
  --primary-d: #b45309;
  --primary-l: #fef3c7;
  --green: #16a34a;
  --green-l: #dcfce7;
  --red: #dc2626;
  --red-l: #fee2e2;
  --orange: #ea580c;
  --blue: #0284c7;
  --blue-l: #e0f2fe;
  --shadow: 0 2px 8px rgba(146, 64, 14, 0.06), 0 1px 2px rgba(146, 64, 14, 0.04);
  --shadow-lg: 0 8px 24px rgba(146, 64, 14, 0.10), 0 2px 6px rgba(146, 64, 14, 0.06);
  --radius: 16px;
  --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  padding-bottom: calc(96px + var(--safe-bottom));
  background-image:
    radial-gradient(circle at 0% 0%, rgba(217, 119, 6, 0.04) 0%, transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(234, 88, 12, 0.04) 0%, transparent 40%);
}

.header {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
  color: white;
  padding: calc(16px + var(--safe-top)) 16px 18px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 4px 20px rgba(180, 83, 9, 0.15);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.header h1 {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header h1 .logo {
  font-size: 22px;
}

.top-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  background: rgba(255,255,255,0.22);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.icon-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }

.section-label {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 8px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: rgba(255,255,255,0.18);
  border-radius: 14px;
  padding: 12px 14px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
}

.stat-label {
  font-size: 11px;
  opacity: 0.9;
  margin-bottom: 4px;
  font-weight: 500;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.stat-value.profit { color: #fef9c3; }
.stat-value.cost { color: #fed7aa; }
.stat-value.income { color: #bbf7d0; }

.today-section {
  margin-top: 12px;
  background: rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.15);
}

.today-row {
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.today-item {
  text-align: center;
  flex: 1;
}

.today-label {
  font-size: 11px;
  opacity: 0.85;
  margin-bottom: 4px;
}

.today-value {
  font-size: 17px;
  font-weight: 700;
}

.today-divider {
  width: 1px;
  height: 30px;
  background: rgba(255,255,255,0.25);
  margin: 0 8px;
}

.main {
  padding: 14px 12px;
  max-width: 640px;
  margin: 0 auto;
}

.toolbar-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

.filters::-webkit-scrollbar { display: none; }

.chip {
  white-space: nowrap;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.chip.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-d));
  color: white;
  border-color: var(--primary-d);
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
}

.filter-row {
  margin-bottom: 8px;
}

.filter-row:last-child { margin-bottom: 0; }

.search-wrap {
  margin-bottom: 0;
}

.search {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s;
}

.search:focus { border-color: var(--primary); background: var(--card); }

.search-icon {
  position: relative;
  display: block;
}

.search-icon::before {
  content: "🔍";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  pointer-events: none;
  z-index: 1;
}

.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding: 0 4px;
}

.list-header-info {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
}

.list-header-info b {
  color: var(--primary-d);
  font-weight: 700;
}

.btn-clear-used {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  color: #92400e;
  border: 1px solid #fcd34d;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
  font-family: inherit;
}

.btn-clear-used:active { transform: scale(0.95); }
.btn-clear-used:disabled { opacity: 0.4; cursor: not-allowed; }

.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.card:active { transform: scale(0.99); }

.card.test { border-left-color: var(--text-3); }
.card.half { border-left-color: var(--blue); }
.card.day  { border-left-color: var(--green); }

.card.used {
  background: linear-gradient(135deg, var(--card) 0%, var(--bg-2) 100%);
}

.card.used::after {
  content: "已使用";
  position: absolute;
  top: 12px;
  right: -32px;
  background: var(--green);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 36px;
  transform: rotate(35deg);
  letter-spacing: 1px;
}

.card-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.card-code {
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 600;
  word-break: break-all;
  flex: 1;
  color: var(--text);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-2);
  flex-wrap: wrap;
}

.badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.badge.test { background: #f3f4f6; color: var(--text-2); }
.badge.half { background: var(--blue-l); color: #075985; }
.badge.day  { background: var(--green-l); color: #166534; }

.status {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.status.unused { background: var(--primary-l); color: var(--primary-d); }
.status.used { background: var(--green-l); color: #166534; }

.card-time { color: var(--text-3); font-size: 11px; }

.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn:active { transform: scale(0.95); }

.btn-use { background: var(--green-l); color: #166534; }
.btn-use:active { background: #bbf7d0; }

.btn-restore { background: var(--primary-l); color: var(--primary-d); }
.btn-restore:active { background: #fde68a; }

.btn-copy { background: var(--blue-l); color: #075985; }
.btn-copy:active { background: #bae6fd; }

.btn-del { background: #f3f4f6; color: var(--text-2); }
.btn-del:active { background: #e5e7eb; }

.empty {
  text-align: center;
  padding: 70px 20px;
  color: var(--text-2);
}

.empty-icon {
  font-size: 56px;
  margin-bottom: 14px;
  opacity: 0.3;
}

.empty-text { font-size: 14px; margin-bottom: 6px; }
.empty-sub { font-size: 12px; color: var(--text-3); }

.fab {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: white;
  border: none;
  padding: 15px 40px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(217, 119, 6, 0.45), 0 2px 6px rgba(217, 119, 6, 0.3);
  cursor: pointer;
  z-index: 20;
  transition: all 0.15s;
  font-family: inherit;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.fab:active { transform: translateX(-50%) scale(0.95); }

.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(69, 26, 3, 0.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-mask.show { display: flex; }

.modal {
  background: var(--card);
  width: 100%;
  max-width: 640px;
  border-radius: 24px 24px 0 0;
  padding: 22px 18px calc(22px + var(--safe-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
  text-align: center;
  color: var(--text);
}

.field {
  margin-bottom: 16px;
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 8px;
  font-weight: 600;
}

.field-input {
  width: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 15px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s;
}

.field-input:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1); }

textarea.field-input {
  resize: vertical;
  min-height: 100px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 14px;
}

.cat-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cat-opt {
  padding: 14px 8px;
  border-radius: 14px;
  border: 2px solid var(--border);
  background: var(--bg-2);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.cat-opt.selected {
  border-color: var(--primary);
  background: linear-gradient(135deg, var(--primary-l), #fef9c3);
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.15);
}

.cat-opt-name { font-size: 14px; font-weight: 700; pointer-events: none; }
.cat-opt-price { font-size: 11px; color: var(--text-2); margin-top: 4px; pointer-events: none; }

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.btn-block {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.btn-block:active { transform: scale(0.98); }

.btn-cancel { background: var(--bg-2); color: var(--text-2); }
.btn-cancel:active { background: var(--border); }
.btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
.btn-primary:active { background: var(--primary-d); }

.toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(69, 26, 3, 0.95);
  color: white;
  padding: 12px 22px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  white-space: nowrap;
  font-weight: 500;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.confirm-wrap {
  align-items: center;
}

.confirm-modal {
  background: var(--card);
  width: 82%;
  max-width: 340px;
  border-radius: 20px;
  padding: 24px 22px;
  text-align: center;
  animation: scaleIn 0.25s ease;
}

@keyframes scaleIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.confirm-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.confirm-text {
  margin-bottom: 20px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-line;
}

.menu-sheet {
  background: var(--card);
  width: 100%;
  max-width: 640px;
  border-radius: 24px 24px 0 0;
  padding: 14px 18px calc(22px + var(--safe-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.menu-header {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.menu-item {
  padding: 16px 6px;
  font-size: 15px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.15s;
}

.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--bg-2); }

.menu-item-icon {
  font-size: 18px;
  margin-right: 4px;
}

.menu-item.danger { color: var(--red); }
.menu-item.danger .menu-item-arrow { color: var(--red); }

.menu-item-arrow { color: var(--text-3); font-size: 16px; }

.menu-cancel {
  margin-top: 10px;
  text-align: center;
  padding: 15px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-2);
  cursor: pointer;
  background: var(--bg-2);
  border-radius: 12px;
}

.menu-cancel:active { background: var(--border); }

@media (min-width: 640px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stat-value { font-size: 24px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1><span class="logo">📒</span>卡密管理</h1>
    <div class="top-actions">
      <button class="icon-btn" id="menuBtn" title="菜单">≡</button>
    </div>
  </div>
  <div class="section-label">累计统计</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">已卖出</div>
      <div class="stat-value" id="statSold">0 张</div>
    </div>
    <div class="stat">
      <div class="stat-label">总成本</div>
      <div class="stat-value cost" id="statCost">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总收入</div>
      <div class="stat-value income" id="statIncome">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总利润</div>
      <div class="stat-value profit" id="statProfit">¥0</div>
    </div>
  </div>
  <div class="today-section">
    <div class="today-row">
      <div class="today-item">
        <div class="today-label">今日卖出</div>
        <div class="today-value" id="todaySold">0 张</div>
      </div>
      <div class="today-divider"></div>
      <div class="today-item">
        <div class="today-label">今日利润</div>
        <div class="today-value" id="todayProfit">¥0</div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="toolbar-card">
    <div class="filter-row">
      <div class="filters" id="catFilters">
        <div class="chip active" data-cat="all">全部类别</div>
        <div class="chip" data-cat="test">测试卡</div>
        <div class="chip" data-cat="half">半天卡</div>
        <div class="chip" data-cat="day">天卡</div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filters" id="statusFilters">
        <div class="chip active" data-status="all">全部状态</div>
        <div class="chip" data-status="unused">未使用</div>
        <div class="chip" data-status="used">已使用</div>
      </div>
    </div>
    <div class="search-wrap search-icon">
      <input type="search" class="search" id="searchInput" placeholder="搜索卡号...">
    </div>
  </div>

  <div class="list-header">
    <span class="list-header-info" id="listCount">共 0 张</span>
    <button class="btn-clear-used" id="quickClearUsed" title="一键清除已使用的卡密">
      <span>🧹</span><span>一键清除已使用</span>
    </button>
  </div>

  <div class="card-list" id="cardList"></div>
</div>

<button class="fab" id="addBtn">+ 添加卡密</button>

<div class="modal-mask" id="addModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加卡密</div>
    <div class="field">
      <label class="field-label">卡号 / 密钥</label>
      <textarea class="field-input" id="codeInput" placeholder="输入卡号或密钥（可批量粘贴，每行一个）"></textarea>
    </div>
    <div class="field">
      <label class="field-label">类别</label>
      <div class="cat-options" id="catOptions">
        <div class="cat-opt selected" data-cat="test">
          <div class="cat-opt-name">测试卡</div>
          <div class="cat-opt-price">¥0 / ¥0</div>
        </div>
        <div class="cat-opt" data-cat="half">
          <div class="cat-opt-name">半天卡</div>
          <div class="cat-opt-price">成本10 售25</div>
        </div>
        <div class="cat-opt" data-cat="day">
          <div class="cat-opt-name">天卡</div>
          <div class="cat-opt-price">成本15 售35</div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-block btn-cancel" id="cancelAdd">取消</button>
      <button class="btn-block btn-primary" id="confirmAdd">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask confirm-wrap" id="confirmMask">
  <div class="confirm-modal">
    <div class="confirm-icon" id="confirmIcon">❓</div>
    <div class="confirm-text" id="confirmText">确认操作？</div>
    <div class="modal-actions">
      <button class="btn-block btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-block btn-primary" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="menuMask">
  <div class="menu-sheet">
    <div class="menu-header">菜单</div>
    <div class="menu-item" id="menuExport"><span><span class="menu-item-icon">📤</span>导出备份</span><span class="menu-item-arrow">›</span></div>
    <div class="menu-item" id="menuImport"><span><span class="menu-item-icon">📥</span>导入备份</span><span class="menu-item-arrow">›</span></div>
    <div class="menu-item" id="menuClearUsed"><span><span class="menu-item-icon">🧹</span>清除已使用记录</span><span class="menu-item-arrow">›</span></div>
    <div class="menu-item danger" id="menuClearAll"><span><span class="menu-item-icon">⚠️</span>清空所有数据</span><span class="menu-item-arrow">›</span></div>
    <div class="menu-cancel" id="menuClose">取消</div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = {
  test: { name: '测试卡', cost: 0, price: 0 },
  half: { name: '半天卡', cost: 10, price: 25 },
  day:  { name: '天卡',   cost: 15, price: 35 }
};

const STORAGE_KEY = 'cardmgmt_v2';

let state = {
  cards: [],
  totals: { sold: 0, cost: 0, income: 0 },
  filterCat: 'all',
  filterStatus: 'all',
  search: '',
  editId: null,
  selectedCat: 'test',
  pendingConfirm: null
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // 兼容旧版本数据迁移
      const oldRaw = localStorage.getItem('cardmgmt_v1');
      if (oldRaw) {
        const oldData = JSON.parse(oldRaw);
        if (Array.isArray(oldData)) {
          state.cards = oldData.filter(c => c.status !== 'scrapped');
        } else {
          state.cards = (oldData.cards || []).filter(c => c.status !== 'scrapped');
          if (oldData.totals) state.totals = oldData.totals;
        }
        save();
      }
      return;
    }
    const data = JSON.parse(raw);
    if (Array.isArray(data)) {
      state.cards = data;
    } else {
      state.cards = data.cards || [];
      if (data.totals) state.totals = data.totals;
    }
    // 过滤掉旧的已作废数据
    state.cards = state.cards.filter(c => c.status !== 'scrapped');
  } catch (e) {
    state.cards = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: state.cards, totals: state.totals }));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtMoney(n) {
  return '¥' + Number(n).toFixed(0);
}

function isToday(ts) {
  if (!ts) return false;
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth()
      && d.getDate() === now.getDate();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function showConfirm(text, cb, icon) {
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmIcon').textContent = icon || '❓';
  document.getElementById('confirmMask').classList.add('show');
  state.pendingConfirm = cb;
}

function render() {
  const sold = state.cards.filter(c => c.status === 'used');
  let cost = state.totals.cost, income = state.totals.income, soldCount = state.totals.sold;
  sold.forEach(c => {
    const cat = CATEGORIES[c.category];
    if (cat) { cost += cat.cost; income += cat.price; soldCount++; }
  });
  const profit = income - cost;

  document.getElementById('statSold').textContent = soldCount + ' 张';
  document.getElementById('statCost').textContent = fmtMoney(cost);
  document.getElementById('statIncome').textContent = fmtMoney(income);
  document.getElementById('statProfit').textContent = fmtMoney(profit);

  // 今日数据
  const todaySold = sold.filter(c => isToday(c.usedAt));
  let todayCost = 0, todayIncome = 0;
  todaySold.forEach(c => {
    const cat = CATEGORIES[c.category];
    if (cat) { todayCost += cat.cost; todayIncome += cat.price; }
  });
  const todayProfit = todayIncome - todayCost;
  document.getElementById('todaySold').textContent = todaySold.length + ' 张';
  document.getElementById('todayProfit').textContent = fmtMoney(todayProfit);

  let list = state.cards.slice();
  if (state.filterCat !== 'all') list = list.filter(c => c.category === state.filterCat);
  if (state.filterStatus !== 'all') list = list.filter(c => c.status === state.filterStatus);
  if (state.search.trim()) {
    const kw = state.search.trim().toLowerCase();
    list = list.filter(c => c.code.toLowerCase().includes(kw));
  }
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  document.getElementById('listCount').innerHTML = '共 <b>' + list.length + '</b> 张';
  const unusedCount = list.filter(c => c.status === 'unused').length;
  const usedCount = list.filter(c => c.status === 'used').length;
  let summaryParts = [];
  if (unusedCount) summaryParts.push('未使用 ' + unusedCount);
  if (usedCount) summaryParts.push('已使用 ' + usedCount);

  // 更新一键清除按钮状态
  const clearBtn = document.getElementById('quickClearUsed');
  const totalUsed = state.cards.filter(c => c.status === 'used').length;
  clearBtn.disabled = totalUsed === 0;
  if (totalUsed > 0) {
    clearBtn.querySelector('span:last-child').textContent = '清除已使用 (' + totalUsed + ')';
  } else {
    clearBtn.querySelector('span:last-child').textContent = '一键清除已使用';
  }

  const listEl = document.getElementById('cardList');
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">' + (state.cards.length ? '没有符合条件的卡密' : '还没有卡密记录') + '</div><div class="empty-sub">' + (state.cards.length ? '试试调整筛选条件' : '点击下方按钮添加第一张卡密') + '</div></div>';
    return;
  }

  listEl.innerHTML = list.map(c => {
    const cat = CATEGORIES[c.category] || { name: '未知' };
    const statusText = { unused: '未使用', used: '已使用' }[c.status] || c.status;
    let actions = '';
    if (c.status === 'unused') {
      actions = `<button class="btn btn-use" data-act="use" data-id="${c.id}">✓ 标记已使用</button>`;
    } else if (c.status === 'used') {
      actions = `<button class="btn btn-restore" data-act="restore" data-id="${c.id}">↩ 恢复未使用</button>`;
    }
    actions += `<button class="btn btn-copy" data-act="copy" data-id="${c.id}">复制</button>
                <button class="btn btn-del" data-act="del" data-id="${c.id}">删除</button>`;

    const timeLabel = c.status === 'used' && c.usedAt ? '使用于 ' + fmtTime(c.usedAt)
                    : '添加于 ' + fmtTime(c.createdAt);

    return `<div class="card ${c.category} ${c.status === 'used' ? 'used' : ''}">
      <div class="card-row">
        <div class="card-code">${escapeHtml(c.code)}</div>
        ${c.status === 'unused' ? `<span class="status ${c.status}">${statusText}</span>` : ''}
      </div>
      <div class="card-meta">
        <span class="badge ${c.category}">${cat.name}</span>
        ${c.category !== 'test' ? `<span>成本${cat.cost} 售${cat.price}</span>` : ''}
        <span class="card-time">· ${timeLabel}</span>
      </div>
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function addCards(codes, category) {
  let added = 0;
  codes.forEach(code => {
    const trimmed = code.trim();
    if (!trimmed) return;
    state.cards.push({
      id: uid(),
      code: trimmed,
      category: category,
      status: 'unused',
      createdAt: Date.now(),
      usedAt: null
    });
    added++;
  });
  if (added > 0) {
    save();
    render();
    toast('已添加 ' + added + ' 张');
  }
}

function clearUsedCards() {
  const usedCards = state.cards.filter(c => c.status === 'used');
  if (usedCards.length === 0) { toast('没有已使用的记录'); return; }
  showConfirm('确认清除 ' + usedCards.length + ' 张已使用的卡密？\n\n（将从列表移除，但累计统计保留）', () => {
    usedCards.forEach(c => {
      const cat = CATEGORIES[c.category];
      if (cat) { state.totals.cost += cat.cost; state.totals.income += cat.price; }
    });
    state.totals.sold += usedCards.length;
    state.cards = state.cards.filter(c => c.status !== 'used');
    save();
    render();
    toast('已清除 ' + usedCards.length + ' 张，累计统计保留');
  }, '🧹');
}

document.getElementById('addBtn').addEventListener('click', () => {
  state.editId = null;
  state.selectedCat = 'test';
  document.getElementById('modalTitle').textContent = '添加卡密';
  document.getElementById('codeInput').value = '';
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.toggle('selected', o.dataset.cat === 'test'));
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('codeInput').focus(), 100);
});

document.getElementById('cancelAdd').addEventListener('click', () => {
  document.getElementById('addModal').classList.remove('show');
});

document.getElementById('catOptions').addEventListener('click', e => {
  const opt = e.target.closest('.cat-opt');
  if (!opt) return;
  state.selectedCat = opt.dataset.cat;
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.toggle('selected', o === opt));
});

document.getElementById('confirmAdd').addEventListener('click', () => {
  const raw = document.getElementById('codeInput').value;
  const codes = raw.split('\n');
  if (!codes.some(c => c.trim())) {
    toast('请输入卡号');
    return;
  }
  addCards(codes, state.selectedCat);
  document.getElementById('addModal').classList.remove('show');
});

document.getElementById('cardList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const card = state.cards.find(c => c.id === id);
  if (!card) return;

  if (act === 'use') {
    card.status = 'used';
    card.usedAt = Date.now();
    save();
    render();
    toast('已标记为已使用');
  } else if (act === 'restore') {
    card.status = 'unused';
    card.usedAt = null;
    save();
    render();
    toast('已恢复为未使用');
  } else if (act === 'del') {
    showConfirm('确认删除这张卡密？', () => {
      state.cards = state.cards.filter(c => c.id !== id);
      save();
      render();
      toast('已删除');
    }, '🗑️');
  } else if (act === 'copy') {
    const text = card.code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
});

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('已复制');
  } catch (e) {
    toast('复制失败，请手动选择');
  }
  document.body.removeChild(ta);
}

document.getElementById('catFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filterCat = chip.dataset.cat;
  document.querySelectorAll('#catFilters .chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('statusFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filterStatus = chip.dataset.status;
  document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmMask').classList.remove('show');
  state.pendingConfirm = null;
});

document.getElementById('confirmOk').addEventListener('click', () => {
  document.getElementById('confirmMask').classList.remove('show');
  if (state.pendingConfirm) {
    const cb = state.pendingConfirm;
    state.pendingConfirm = null;
    cb();
  }
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuMask').classList.add('show');
});

document.getElementById('menuClose').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
});

document.getElementById('quickClearUsed').addEventListener('click', () => {
  clearUsedCards();
});

document.getElementById('menuClearUsed').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  clearUsedCards();
});

document.getElementById('menuExport').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  const data = JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), cards: state.cards, totals: state.totals }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '卡密备份_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出备份');
});

document.getElementById('menuImport').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.cards || !Array.isArray(data.cards)) throw new Error('格式错误');
      const validCards = data.cards.filter(c => c.status !== 'scrapped');
      showConfirm('导入将合并到现有数据，共 ' + validCards.length + ' 张，继续？', () => {
        if (data.totals) {
          state.totals.sold += data.totals.sold || 0;
          state.totals.cost += data.totals.cost || 0;
          state.totals.income += data.totals.income || 0;
        }
        validCards.forEach(c => {
          if (!state.cards.find(x => x.id === c.id)) {
            state.cards.push(c);
          }
        });
        save();
        render();
        toast('已导入 ' + validCards.length + ' 张');
      }, '📥');
    } catch (err) {
      toast('文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('menuClearAll').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  showConfirm('确认清空所有卡密数据？\n\n此操作不可恢复！', () => {
    state.cards = [];
    state.totals = { sold: 0, cost: 0, income: 0 };
    save();
    render();
    toast('已清空');
  }, '⚠️');
});

[document.getElementById('addModal'), document.getElementById('menuMask'), document.getElementById('confirmMask')].forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('show');
  });
});

load();
render();
</script>
</body>
</html>
