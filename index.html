<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>卡密管理</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #fafafa;
  --bg-hover: #f5f5f5;
  --text: #111111;
  --text-2: #6b6b6b;
  --text-3: #999999;
  --border: #e8e8e8;
  --border-strong: #1a1a1a;
  --accent: #000000;
  --green: #0071e3;
  --green-bg: #f0f7ff;
  --orange: #ff9500;
  --orange-bg: #fff8ed;
  --red: #ff3b30;
  --red-bg: #fff0f0;
  --radius: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

body {
  min-height: 100vh;
  padding-bottom: calc(100px + var(--safe-bottom));
  background: var(--bg);
}

/* 顶部 Header */
.header {
  background: var(--bg);
  padding: calc(16px + var(--safe-top)) 20px 0;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
}

.icon-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.icon-btn:active { background: var(--bg-hover); transform: scale(0.95); }

/* 统计区 */
.stats-section {
  padding: 20px 20px 24px;
}

.section-title {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}

.stat {
  background: var(--bg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 88px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  font-feature-settings: "tnum";
}

.stat-value.profit { color: var(--text); }
.stat-value.cost { color: var(--text-2); }
.stat-value.income { color: var(--text); }

/* 今日数据条 */
.today-bar {
  margin: 14px 20px 0;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.today-label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
}

.today-stats {
  display: flex;
  gap: 20px;
  align-items: center;
}

.today-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.today-item-label {
  font-size: 11px;
  color: var(--text-3);
}

.today-item-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  font-feature-settings: "tnum";
}

.today-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
  margin-right: 8px;
}

/* 主区域 */
.main {
  padding: 24px 20px 20px;
  max-width: 640px;
  margin: 0 auto;
}

/* 工具栏 */
.toolbar {
  margin-bottom: 20px;
}

.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
  margin-bottom: 10px;
}

.filter-row::-webkit-scrollbar { display: none; }

.filter-row:last-child { margin-bottom: 0; }

.chip {
  white-space: nowrap;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}

.chip.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.search-wrap {
  position: relative;
  margin-top: 10px;
}

.search {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: all 0.15s;
  color: var(--text);
}

.search:focus {
  border-color: var(--accent);
  background: var(--bg);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  opacity: 0.4;
  pointer-events: none;
}

/* 列表头部 */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 2px;
}

.list-header-info {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
}

.list-header-info b {
  color: var(--text);
  font-weight: 700;
}

.btn-clear-used {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  font-family: inherit;
}

.btn-clear-used:active { transform: scale(0.96); background: var(--bg-hover); }
.btn-clear-used:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-clear-used svg {
  width: 12px;
  height: 12px;
}

/* 卡片列表 */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.card {
  background: var(--bg);
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
  transition: all 0.15s;
  position: relative;
}

.card:last-child { border-bottom: none; }

.card:active { background: var(--bg-soft); }

.card.test .card-code::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  margin-right: 10px;
  vertical-align: middle;
}

.card.half .card-code::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 10px;
  vertical-align: middle;
}

.card.day .card-code::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
  margin-right: 10px;
  vertical-align: middle;
}

.card-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.card-code {
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 600;
  word-break: break-all;
  flex: 1;
  color: var(--text);
  letter-spacing: -0.01em;
}

.card-status {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--bg-soft);
  white-space: nowrap;
}

.card-status.used {
  color: var(--green);
  background: var(--green-bg);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-3);
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.card-meta-divider {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-3);
  opacity: 0.5;
}

.card-cat {
  font-weight: 500;
  color: var(--text-2);
}

.card-price {
  font-variant-numeric: tabular-nums;
}

.card-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
  font-family: inherit;
  color: var(--text);
}

.btn:active { transform: scale(0.96); background: var(--bg-hover); }

.btn-use {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.btn-use:active { background: #333; }

.btn-restore {
  background: var(--bg);
  color: var(--text);
  border-color: var(--border);
}

.btn-copy {
  background: var(--bg);
  color: var(--text-2);
}

.btn-del {
  background: var(--bg);
  color: var(--text-3);
  border-color: var(--border);
}

/* 空状态 */
.empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-3);
}

.empty-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 18px;
  opacity: 0.3;
}

.empty-text {
  font-size: 15px;
  color: var(--text-2);
  margin-bottom: 6px;
  font-weight: 500;
}

.empty-sub {
  font-size: 13px;
  color: var(--text-3);
}

/* FAB */
.fab {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 16px 40px;
  border-radius: 100px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.1);
  cursor: pointer;
  z-index: 20;
  transition: all 0.15s;
  font-family: inherit;
  letter-spacing: -0.01em;
}

.fab:active {
  transform: translateX(-50%) scale(0.96);
  background: #333;
}

/* 模态框 */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-mask.show { display: flex; }

.modal {
  background: var(--bg);
  width: 100%;
  max-width: 640px;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px calc(24px + var(--safe-bottom));
  animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 24px;
  text-align: center;
  color: var(--text);
  letter-spacing: -0.02em;
}

.field {
  margin-bottom: 20px;
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 8px;
  font-weight: 600;
}

.field-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-size: 15px;
  outline: none;
  font-family: inherit;
  transition: all 0.15s;
  color: var(--text);
}

.field-input:focus {
  border-color: var(--accent);
  background: var(--bg);
}

textarea.field-input {
  resize: vertical;
  min-height: 100px;
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: 14px;
}

.cat-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.cat-opt {
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}

.cat-opt.selected {
  border-color: var(--accent);
  background: var(--bg);
  border-width: 2px;
  padding: 13px 7px;
}

.cat-opt-name {
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
  color: var(--text);
}

.cat-opt-price {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 4px;
  pointer-events: none;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

.btn-block {
  flex: 1;
  padding: 15px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.btn-block:active { transform: scale(0.98); }

.btn-cancel {
  background: var(--bg-soft);
  color: var(--text-2);
}

.btn-cancel:active { background: var(--bg-hover); }

.btn-primary {
  background: var(--accent);
  color: var(--bg);
}

.btn-primary:active { background: #333; }

/* Toast */
.toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(0, 0, 0, 0.9);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 100px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  white-space: nowrap;
  font-weight: 500;
  backdrop-filter: blur(10px);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 确认框 */
.confirm-wrap { align-items: center; }

.confirm-modal {
  background: var(--bg);
  width: 86%;
  max-width: 320px;
  border-radius: 16px;
  padding: 28px 24px 20px;
  text-align: center;
  animation: scaleIn 0.2s ease;
}

@keyframes scaleIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.confirm-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.confirm-text {
  margin-bottom: 22px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-2);
  white-space: pre-line;
}

.confirm-actions {
  display: flex;
  gap: 10px;
}

.confirm-actions .btn-block {
  padding: 12px;
  font-size: 14px;
}

/* 菜单 */
.menu-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 640px;
  border-radius: 20px 20px 0 0;
  padding: 12px 8px calc(20px + var(--safe-bottom));
  animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}

.menu-header {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  font-weight: 600;
  margin-bottom: 12px;
  padding: 8px 0;
  letter-spacing: 0.05em;
}

.menu-item {
  padding: 16px 16px;
  font-size: 15px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.12s;
  color: var(--text);
  font-weight: 500;
}

.menu-item:last-of-type { border-bottom: none; }
.menu-item:active { background: var(--bg-hover); }

.menu-item.danger { color: var(--red); }
.menu-item.danger .menu-item-arrow { color: var(--red); }

.menu-item-arrow {
  color: var(--text-3);
  font-size: 18px;
  font-weight: 400;
}

.menu-cancel {
  margin-top: 10px;
  text-align: center;
  padding: 15px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
}

.menu-cancel:active { background: var(--bg-hover); }

@media (min-width: 640px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stat-value { font-size: 28px; }
  .header h1 { font-size: 32px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>卡密</h1>
    <button class="icon-btn" id="menuBtn" aria-label="菜单">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </svg>
    </button>
  </div>
</div>

<div class="stats-section">
  <div class="section-title">总览</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">已卖出</div>
      <div class="stat-value" id="statSold">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总成本</div>
      <div class="stat-value cost" id="statCost">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总收入</div>
      <div class="stat-value income" id="statIncome">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总利润</div>
      <div class="stat-value profit" id="statProfit">¥0</div>
    </div>
  </div>
</div>

<div class="today-bar">
  <div class="today-label">
    <span class="today-dot"></span>今日
  </div>
  <div class="today-stats">
    <div class="today-item">
      <span class="today-item-label">卖出</span>
      <span class="today-item-value" id="todaySold">0</span>
    </div>
    <div class="today-item">
      <span class="today-item-label">利润</span>
      <span class="today-item-value" id="todayProfit">¥0</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="filter-row" id="catFilters">
      <div class="chip active" data-cat="all">全部</div>
      <div class="chip" data-cat="test">测试卡</div>
      <div class="chip" data-cat="half">半天卡</div>
      <div class="chip" data-cat="day">天卡</div>
    </div>
    <div class="filter-row" id="statusFilters">
      <div class="chip active" data-status="all">全部状态</div>
      <div class="chip" data-status="unused">未使用</div>
      <div class="chip" data-status="used">已使用</div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.5" y2="16.5"/>
      </svg>
      <input type="search" class="search" id="searchInput" placeholder="搜索卡号">
    </div>
  </div>

  <div class="list-header">
    <span class="list-header-info" id="listCount">共 <b>0</b> 张</span>
    <button class="btn-clear-used" id="quickClearUsed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
      <span id="clearUsedText">清除已使用</span>
    </button>
  </div>

  <div class="card-list" id="cardList"></div>
</div>

<button class="fab" id="addBtn">+ 添加卡密</button>

<!-- 添加模态框 -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <div class="modal-title">添加卡密</div>
    <div class="field">
      <label class="field-label">卡号 / 密钥</label>
      <textarea class="field-input" id="codeInput" placeholder="输入卡号或密钥（可批量粘贴，每行一个）"></textarea>
    </div>
    <div class="field">
      <label class="field-label">类别</label>
      <div class="cat-options" id="catOptions">
        <div class="cat-opt selected" data-cat="test">
          <div class="cat-opt-name">测试卡</div>
          <div class="cat-opt-price">¥0 / ¥0</div>
        </div>
        <div class="cat-opt" data-cat="half">
          <div class="cat-opt-name">半天卡</div>
          <div class="cat-opt-price">成本10 售25</div>
        </div>
        <div class="cat-opt" data-cat="day">
          <div class="cat-opt-name">天卡</div>
          <div class="cat-opt-price">成本15 售35</div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-block btn-cancel" id="cancelAdd">取消</button>
      <button class="btn-block btn-primary" id="confirmAdd">保存</button>
    </div>
  </div>
</div>

<!-- 确认框 -->
<div class="modal-mask confirm-wrap" id="confirmMask">
  <div class="confirm-modal">
    <div class="confirm-title" id="confirmTitle">确认操作</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button class="btn-block btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-block btn-primary" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- 菜单 -->
<div class="modal-mask" id="menuMask">
  <div class="menu-sheet">
    <div class="menu-header">菜单</div>
    <div class="menu-item" id="menuExport">
      <span>导出备份</span>
      <span class="menu-item-arrow">›</span>
    </div>
    <div class="menu-item" id="menuImport">
      <span>导入备份</span>
      <span class="menu-item-arrow">›</span>
    </div>
    <div class="menu-item" id="menuClearUsed">
      <span>清除已使用记录</span>
      <span class="menu-item-arrow">›</span>
    </div>
    <div class="menu-item danger" id="menuClearAll">
      <span>清空所有数据</span>
      <span class="menu-item-arrow">›</span>
    </div>
    <div class="menu-cancel" id="menuClose">取消</div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = {
  test: { name: '测试卡', cost: 0, price: 0 },
  half: { name: '半天卡', cost: 10, price: 25 },
  day:  { name: '天卡',   cost: 15, price: 35 }
};

const STORAGE_KEY = 'cardmgmt_v2';

let state = {
  cards: [],
  totals: { sold: 0, cost: 0, income: 0 },
  filterCat: 'all',
  filterStatus: 'all',
  search: '',
  selectedCat: 'test',
  pendingConfirm: null
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const oldRaw = localStorage.getItem('cardmgmt_v1');
      if (oldRaw) {
        const oldData = JSON.parse(oldRaw);
        if (Array.isArray(oldData)) {
          state.cards = oldData.filter(c => c.status !== 'scrapped');
        } else {
          state.cards = (oldData.cards || []).filter(c => c.status !== 'scrapped');
          if (oldData.totals) state.totals = oldData.totals;
        }
        save();
      }
      return;
    }
    const data = JSON.parse(raw);
    if (Array.isArray(data)) {
      state.cards = data;
    } else {
      state.cards = data.cards || [];
      if (data.totals) state.totals = data.totals;
    }
    state.cards = state.cards.filter(c => c.status !== 'scrapped');
  } catch (e) {
    state.cards = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: state.cards, totals: state.totals }));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtMoney(n) {
  return '¥' + Number(n).toFixed(0);
}

function isToday(ts) {
  if (!ts) return false;
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth()
      && d.getDate() === now.getDate();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function showConfirm(title, text, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmMask').classList.add('show');
  state.pendingConfirm = cb;
}

function render() {
  const sold = state.cards.filter(c => c.status === 'used');
  let cost = state.totals.cost, income = state.totals.income, soldCount = state.totals.sold;
  sold.forEach(c => {
    const cat = CATEGORIES[c.category];
    if (cat) { cost += cat.cost; income += cat.price; soldCount++; }
  });
  const profit = income - cost;

  document.getElementById('statSold').textContent = soldCount;
  document.getElementById('statCost').textContent = fmtMoney(cost);
  document.getElementById('statIncome').textContent = fmtMoney(income);
  document.getElementById('statProfit').textContent = fmtMoney(profit);

  // 今日数据
  const todaySold = sold.filter(c => isToday(c.usedAt));
  let todayCost = 0, todayIncome = 0;
  todaySold.forEach(c => {
    const cat = CATEGORIES[c.category];
    if (cat) { todayCost += cat.cost; todayIncome += cat.price; }
  });
  const todayProfit = todayIncome - todayCost;
  document.getElementById('todaySold').textContent = todaySold.length;
  document.getElementById('todayProfit').textContent = fmtMoney(todayProfit);

  // 筛选
  let list = state.cards.slice();
  if (state.filterCat !== 'all') list = list.filter(c => c.category === state.filterCat);
  if (state.filterStatus !== 'all') list = list.filter(c => c.status === state.filterStatus);
  if (state.search.trim()) {
    const kw = state.search.trim().toLowerCase();
    list = list.filter(c => c.code.toLowerCase().includes(kw));
  }
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  document.getElementById('listCount').innerHTML = '共 <b>' + list.length + '</b> 张';

  // 更新清除按钮
  const clearBtn = document.getElementById('quickClearUsed');
  const clearText = document.getElementById('clearUsedText');
  const totalUsed = state.cards.filter(c => c.status === 'used').length;
  clearBtn.disabled = totalUsed === 0;
  clearText.textContent = totalUsed > 0 ? '清除 (' + totalUsed + ')' : '清除已使用';

  const listEl = document.getElementById('cardList');
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">' +
      '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
      '<rect x="3" y="4" width="18" height="16" rx="2"/>' +
      '<line x1="8" y1="10" x2="16" y2="10"/>' +
      '<line x1="8" y1="14" x2="13" y2="14"/>' +
      '</svg>' +
      '<div class="empty-text">' + (state.cards.length ? '没有符合条件的卡密' : '还没有卡密记录') + '</div>' +
      '<div class="empty-sub">' + (state.cards.length ? '试试调整筛选条件' : '点击下方按钮添加第一张') + '</div>' +
      '</div>';
    return;
  }

  listEl.innerHTML = list.map(c => {
    const cat = CATEGORIES[c.category] || { name: '未知' };
    const statusText = c.status === 'used' ? '已使用' : '未使用';
    let actions = '';
    if (c.status === 'unused') {
      actions = `<button class="btn btn-use" data-act="use" data-id="${c.id}">标记已使用</button>`;
    } else if (c.status === 'used') {
      actions = `<button class="btn btn-restore" data-act="restore" data-id="${c.id}">恢复</button>`;
    }
    actions += `<button class="btn btn-copy" data-act="copy" data-id="${c.id}">复制</button>
                <button class="btn btn-del" data-act="del" data-id="${c.id}">删除</button>`;

    const timeLabel = c.status === 'used' && c.usedAt ? fmtTime(c.usedAt) : fmtTime(c.createdAt);
    const timePrefix = c.status === 'used' ? '使用' : '添加';

    return `<div class="card ${c.category}">
      <div class="card-row">
        <div class="card-code">${escapeHtml(c.code)}</div>
        <span class="card-status ${c.status}">${statusText}</span>
      </div>
      <div class="card-meta">
        <span class="card-cat">${cat.name}</span>
        ${c.category !== 'test' ? `<span class="card-meta-divider"></span><span class="card-price">成本${cat.cost} 售${cat.price}</span>` : ''}
        <span class="card-meta-divider"></span>
        <span>${timePrefix}于 ${timeLabel}</span>
      </div>
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function addCards(codes, category) {
  let added = 0;
  codes.forEach(code => {
    const trimmed = code.trim();
    if (!trimmed) return;
    state.cards.push({
      id: uid(),
      code: trimmed,
      category: category,
      status: 'unused',
      createdAt: Date.now(),
      usedAt: null
    });
    added++;
  });
  if (added > 0) {
    save();
    render();
    toast('已添加 ' + added + ' 张');
  }
}

function clearUsedCards() {
  const usedCards = state.cards.filter(c => c.status === 'used');
  if (usedCards.length === 0) { toast('没有已使用的记录'); return; }
  showConfirm('清除已使用', '确认清除 ' + usedCards.length + ' 张已使用的卡密？\n\n将从列表移除，但累计统计保留。', () => {
    usedCards.forEach(c => {
      const cat = CATEGORIES[c.category];
      if (cat) { state.totals.cost += cat.cost; state.totals.income += cat.price; }
    });
    state.totals.sold += usedCards.length;
    state.cards = state.cards.filter(c => c.status !== 'used');
    save();
    render();
    toast('已清除 ' + usedCards.length + ' 张');
  });
}

// 事件绑定
document.getElementById('addBtn').addEventListener('click', () => {
  state.selectedCat = 'test';
  document.getElementById('codeInput').value = '';
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.toggle('selected', o.dataset.cat === 'test'));
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('codeInput').focus(), 100);
});

document.getElementById('cancelAdd').addEventListener('click', () => {
  document.getElementById('addModal').classList.remove('show');
});

document.getElementById('catOptions').addEventListener('click', e => {
  const opt = e.target.closest('.cat-opt');
  if (!opt) return;
  state.selectedCat = opt.dataset.cat;
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.toggle('selected', o === opt));
});

document.getElementById('confirmAdd').addEventListener('click', () => {
  const raw = document.getElementById('codeInput').value;
  const codes = raw.split('\n');
  if (!codes.some(c => c.trim())) {
    toast('请输入卡号');
    return;
  }
  addCards(codes, state.selectedCat);
  document.getElementById('addModal').classList.remove('show');
});

document.getElementById('cardList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const card = state.cards.find(c => c.id === id);
  if (!card) return;

  if (act === 'use') {
    card.status = 'used';
    card.usedAt = Date.now();
    save();
    render();
    toast('已标记为已使用');
  } else if (act === 'restore') {
    card.status = 'unused';
    card.usedAt = null;
    save();
    render();
    toast('已恢复为未使用');
  } else if (act === 'del') {
    showConfirm('删除卡密', '确认删除这张卡密？此操作不可恢复。', () => {
      state.cards = state.cards.filter(c => c.id !== id);
      save();
      render();
      toast('已删除');
    });
  } else if (act === 'copy') {
    const text = card.code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
});

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('已复制');
  } catch (e) {
    toast('复制失败');
  }
  document.body.removeChild(ta);
}

document.getElementById('catFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filterCat = chip.dataset.cat;
  document.querySelectorAll('#catFilters .chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('statusFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filterStatus = chip.dataset.status;
  document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmMask').classList.remove('show');
  state.pendingConfirm = null;
});

document.getElementById('confirmOk').addEventListener('click', () => {
  document.getElementById('confirmMask').classList.remove('show');
  if (state.pendingConfirm) {
    const cb = state.pendingConfirm;
    state.pendingConfirm = null;
    cb();
  }
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuMask').classList.add('show');
});

document.getElementById('menuClose').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
});

document.getElementById('quickClearUsed').addEventListener('click', () => {
  clearUsedCards();
});

document.getElementById('menuClearUsed').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  clearUsedCards();
});

document.getElementById('menuExport').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  const data = JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), cards: state.cards, totals: state.totals }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '卡密备份_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出备份');
});

document.getElementById('menuImport').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.cards || !Array.isArray(data.cards)) throw new Error('格式错误');
      const validCards = data.cards.filter(c => c.status !== 'scrapped');
      showConfirm('导入备份', '导入将合并到现有数据，共 ' + validCards.length + ' 张，继续？', () => {
        if (data.totals) {
          state.totals.sold += data.totals.sold || 0;
          state.totals.cost += data.totals.cost || 0;
          state.totals.income += data.totals.income || 0;
        }
        validCards.forEach(c => {
          if (!state.cards.find(x => x.id === c.id)) {
            state.cards.push(c);
          }
        });
        save();
        render();
        toast('已导入 ' + validCards.length + ' 张');
      });
    } catch (err) {
      toast('文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('menuClearAll').addEventListener('click', () => {
  document.getElementById('menuMask').classList.remove('show');
  showConfirm('清空数据', '确认清空所有卡密数据？\n\n此操作不可恢复！', () => {
    state.cards = [];
    state.totals = { sold: 0, cost: 0, income: 0 };
    save();
    render();
    toast('已清空');
  });
});

[document.getElementById('addModal'), document.getElementById('menuMask'), document.getElementById('confirmMask')].forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('show');
  });
});

load();
render();
</script>
</body>
</html>
